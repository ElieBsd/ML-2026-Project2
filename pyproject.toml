[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdpbpc"
version = "0.1.0"
description = "Testing the binary pattern-based channel (BPC) model for copy detection pattern authentication"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "scikit-image==0.26.0",
    "matplotlib==3.11.2",
    "pandas==3.1.1",
    "pyyaml==6.0.3",
    "pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
