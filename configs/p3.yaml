# Masked Hamming distance whose mask of reliable symbols comes from the 5x5 back-off
# table instead of the 3x3 table. Both tables are learned on the same
# originals of the tested condition (blocks E and M, never judged), and both scores use
# the same positions (distance >= 2 from the border). Thresholds: conformal, on originals.
data_dir: dataset
seed: 0
mu: 0.01
margin: 2
backoff_masses: [2, 5, 10, 20, 50, 100, 200, 500]   # chosen by log-loss, two halves of E + M
n_boot: 2000
# Commit of the methods freeze (2026-11-25). --stage test refuses to run without it.
freeze_commit: null
# Rule set before the run, on development: the 5x5 mask cuts the oracle P_err^min
# of the 3x3 mask by >= 30 %
decision: {condition: mobile_SamsungGN20U, min_cut: 0.30}

indigo:
  mobile:
    devices: [iPhone12Pro, SamsungGN20U]
    capture_run: 1
    alphas: [0.01, 0.05]
  scanner:
    printers: [HPI55, HPI76]
    fakes: [HPI55_EHPI55, HPI55_EHPI76, HPI76_EHPI55, HPI76_EHPI76]   # printer_estimate
    alphas: [0.05]

scantrust:
  attacks: [otsu+unsharp, deep+unsharp]
  alphas: [0.05, 0.10]
